<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Matheus Simões</title>
  <desc id="desc">Assinatura laranja de Matheus Simões entre dois emblemas de lobo angulares</desc>
  <defs>
    <linearGradient id="ember" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5a00"/>
      <stop offset="46%" stop-color="#ff7a00"/>
      <stop offset="54%" stop-color="#ffb45c"/>
      <stop offset="100%" stop-color="#ff5a00"/>
    </linearGradient>
    <linearGradient id="wolfFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb45c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff5a00" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="emberGlow" x="-20%" y="-35%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ff7a00" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="signatureMask" maskUnits="userSpaceOnUse" x="250" y="102" width="700" height="76" style="mask-type:alpha">
      <image x="250" y="102" width="700" height="76" preserveAspectRatio="none" href="data:image/png;base64,"/>
    </mask>
    <g id="wolf" fill="url(#wolfFill)" stroke="url(#ember)" stroke-width="3" stroke-linejoin="miter" stroke-linecap="square">
      <path d="M86 20 62 52 42 40 47 82 25 112 51 137 64 174 86 194 108 174 121 137 147 112 125 82 130 40 110 52Z"/>
      <path d="m62 52 24 22 24-22M47 82l39 26 39-26M25 112l43 7 18 55 18-55 43-7" fill="none"/>
      <path d="m51 137 33-13 2 50 2-50 33 13M64 174l22 20 22-20" fill="none"/>
      <path d="m57 96 21 8-16 10Zm58 0-21 8 16 10Z" fill="#ffd49b" stroke="none"/>
      <path d="m78 151 8 9 8-9-8-5Z" fill="#ff7a00" stroke="none"/>
    </g>
  </defs>

  <g opacity="0.96" filter="url(#emberGlow)">
    <use href="#wolf" x="30" y="30"/>
    <use href="#wolf" x="998" y="30"/>
  </g>

  <g fill="none" stroke="url(#ember)" stroke-width="2" opacity="0.6">
    <path d="M196 140h49l18-14M1004 140h-49l-18-14"/>
    <path d="M196 148h36M1004 148h-36"/>
  </g>

  <rect x="250" y="102" width="700" height="76" fill="url(#ember)" mask="url(#signatureMask)" filter="url(#emberGlow)"/>
</svg>

